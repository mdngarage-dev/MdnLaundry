name: Delete Admin Account

on:
  workflow_dispatch:
    inputs:
      caller_uid:
        description: "UID owner yang meminta penghapusan"
        required: true
      target_uid:
        description: "UID admin yang akan dihapus"
        required: true

jobs:
  delete-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Hapus akun admin
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CALLER_UID: ${{ inputs.caller_uid }}
          TARGET_UID: ${{ inputs.target_uid }}
        run: node delete-admin.js