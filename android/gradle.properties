# ==============================================================================
# OPTIMALISASI PERFORMA GRADLE (Digabung jadi satu baris agar tidak tabrakan)
# ==============================================================================
# Di sini RAM diatur sebesar 6GB (-Xmx6g), batas aman & ngebut untuk laptop RAM 8GB/16GB.
# Jika RAM laptop kamu besar (misal 16GB atau 32GB) dan ingin dialokasikan 8GB, ubah -Xmx6g menjadi -Xmx8g
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Mengaktifkan fitur agar Gradle tetap berjalan di latar belakang (Bikin build kedua dst jauh lebih cepat)
org.gradle.daemon=true

# Mengizinkan kompilasi beberapa modul project secara bersamaan (Paralel)
org.gradle.parallel=true

# Menyimpan cache hasil kompilasi (Sangat menghemat waktu jika tidak ada perubahan kode masif)
org.gradle.caching=true


# ==============================================================================
# KONFIGURASI ANDROID & KOTLIN
# ==============================================================================
# Wajib untuk project modern yang menggunakan library AndroidX
android.useAndroidX=true

# Mengabaikan warning versi SDK jika kamu menggunakan compileSdk yang sangat baru
android.suppressUnsupportedCompileSdk=true

# Menyembunyikan pesan deprecation (kedaluwarsa) Kotlin di terminal agar log build bersih
kotlin.suppress.deprecation.warnings=true

# Menonaktifkan mode penuh R8 (diperlukan jika beberapa library pihak ketiga/Firebase kamu crash saat release)
android.enableR8.fullMode=false
# Mematikan kompilasi inkremental Kotlin untuk menghindari bug lintas drive Windows
kotlin.incremental=false
kotlin.incremental.android=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
