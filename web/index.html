<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lacak Order – Madeena Laundry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ── GANTI dengan config Firebase project kamu ──────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyAUs_7vHagR7rc24kkGtxoKpTLbSd9-X4w",
      authDomain: "laundry-ku-id.firebaseapp.com",
      projectId: "laundry-ku-id",
      storageBucket: "laundry-ku-id.firebasestorage.app",
      messagingSenderId: "518877666392",
      appId: "1:518877666392:web:d4885be99c724e5783fe2d",
      measurementId: "G-0W7K571RTN"
    };
    // ───────────────────────────────────────────────────────────────────

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // ── Status pipeline (sama persis dengan Flutter) ─────────────────
    const PIPELINE = [
      { key: "antrian",    label: "Antrian",         desc: "Order masuk dan menunggu diproses",          color: "#4F6FE8" },
      { key: "proses",     label: "Sedang Diproses",  desc: "Laundry sedang dalam pengerjaan",            color: "#F59E0B" },
      { key: "siap ambil", label: "Siap Diambil",     desc: "Laundry selesai dan siap diambil",           color: "#0D9488" },
      { key: "selesai",    label: "Selesai",           desc: "Order telah selesai dan diambil pelanggan",  color: "#10B981" },
    ];

    function formatDate(ts) {
      if (!ts) return "-";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
    }
    function formatDateTime(ts) {
      if (!ts) return "-";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }) +
             ", " + d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
    }
    function formatRupiah(n) {
      return "Rp " + Number(n).toLocaleString("id-ID");
    }

    async function cariOrder(noOrder) {
      const q = query(collection(db, "order"),
        where("nomor_pelanggan", "==", noOrder));
      const snap = await getDocs(q);
      if (snap.empty) return null;
      return { id: snap.docs[0].id, ...snap.docs[0].data() };
    }

    function renderResult(data) {
      const status     = (data.status || "").toLowerCase();
      const activeIdx  = PIPELINE.findIndex(s => s.key === status);
      const realIdx    = activeIdx === -1 ? PIPELINE.length - 1 : activeIdx;
      const activeColor = PIPELINE[realIdx].color;
      const activeLabel = activeIdx === -1 ? "Selesai" : PIPELINE[realIdx].label;

      const nama      = data.nama_pelanggan || "-";
      const noHp      = data.no_hp || "";
      const estimasi  = data.estimasi_selesai || "-";
      const harga     = data.harga_total ? formatRupiah(data.harga_total) : "-";
      const layanan   = data.layanan_nama || "-";
      const masuk     = formatDateTime(data.waktu_order);
      const noOrder   = data.nomor_pelanggan || "-";

      // Build timeline HTML
      let timelineHTML = "";
      PIPELINE.forEach((step, i) => {
        const isDone   = i <= realIdx;
        const isActive = i === realIdx;
        const isLast   = i === PIPELINE.length - 1;

        let timeLabel = "";
        if (i === 0) timeLabel = masuk;
        else if (isActive) timeLabel = formatDate(new Date());

        let descText = step.desc;
        if (isActive && estimasi && estimasi !== "-") descText = `Est. selesai: ${estimasi}`;

        timelineHTML += `
          <div class="tl-row${isLast ? " last" : ""}">
            <div class="tl-left">
              <div class="tl-dot${isActive ? " active" : ""}${isDone ? " done" : ""}"
                   style="${isDone ? `background:${step.color};${isActive ? `box-shadow:0 0 0 4px ${step.color}33` : ""}` : ""}"></div>
              ${!isLast ? `<div class="tl-line" style="${i < realIdx ? `background:${step.color}66` : ""}"></div>` : ""}
            </div>
            <div class="tl-content">
              <p class="tl-label${isActive ? " active-label" : ""}${!isDone ? " muted" : ""}"
                 style="${isActive ? `color:${step.color}` : ""}">${step.label}</p>
              <p class="tl-desc${!isDone ? " muted" : ""}">${descText}</p>
              ${timeLabel ? `<p class="tl-time" style="color:${isDone ? step.color : "#ccc"}">${timeLabel}</p>` : ""}
            </div>
          </div>`;
      });

      document.getElementById("result-area").innerHTML = `
        <div class="card result-card" style="--accent:${activeColor}">
          <!-- Header -->
          <div class="card-header">
            <div class="status-icon" style="background:${activeColor}22">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${activeColor}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                ${getStatusIcon(realIdx)}
              </svg>
            </div>
            <div class="card-meta">
              <p class="order-no">${noOrder}</p>
              <p class="cust-name">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                ${nama}
              </p>
            </div>
            <span class="badge" style="background:${activeColor}18;color:${activeColor}">${activeLabel}</span>
          </div>

          <div class="divider"></div>

          <!-- Info row -->
          <div class="info-grid">
            <div class="info-item">
              <span class="info-icon">🧺</span>
              <div>
                <p class="info-label">Layanan</p>
                <p class="info-val">${layanan}</p>
              </div>
            </div>
            <div class="info-item">
              <span class="info-icon">💳</span>
              <div>
                <p class="info-label">Total</p>
                <p class="info-val" style="color:${activeColor};font-weight:700">${harga}</p>
              </div>
            </div>
            ${noHp ? `<div class="info-item">
              <span class="info-icon">📱</span>
              <div>
                <p class="info-label">No. HP</p>
                <p class="info-val">${noHp}</p>
              </div>
            </div>` : ""}
          </div>

          <div class="divider"></div>

          <!-- Timeline -->
          <div class="timeline">${timelineHTML}</div>
        </div>`;

      document.getElementById("result-area").style.opacity = "0";
      document.getElementById("result-area").style.transform = "translateY(16px)";
      requestAnimationFrame(() => {
        document.getElementById("result-area").style.transition = "opacity .4s ease, transform .4s ease";
        document.getElementById("result-area").style.opacity = "1";
        document.getElementById("result-area").style.transform = "translateY(0)";
      });
    }

    function getStatusIcon(idx) {
      const icons = [
        `<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`,  // timer
        `<rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>`, // laundry simplified
        `<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="20" x2="22" y2="20"/>`, // box
        `<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>`, // check
      ];
      return icons[idx] || icons[3];
    }

    // ── Search handler ───────────────────────────────────────────────
    async function doSearch() {
      const input = document.getElementById("search-input");
      const val   = input.value.trim().toUpperCase();
      if (!val) return;

      const btn     = document.getElementById("search-btn");
      const errEl   = document.getElementById("error-msg");
      const resultEl = document.getElementById("result-area");

      errEl.textContent = "";
      resultEl.innerHTML = "";
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>`;

      try {
        const data = await cariOrder(val);
        if (!data) {
          errEl.textContent = `Order "${val}" tidak ditemukan. Periksa kembali nomor order kamu.`;
        } else {
          renderResult(data);
        }
      } catch (e) {
        errEl.textContent = "Gagal menghubungi server. Pastikan koneksi internet kamu aktif.";
        console.error(e);
      }

      btn.disabled = false;
      btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Lacak`;
    }

    // ── Detect nomor order dari URL (path atau query param) ─────────
    function getOrderFromURL() {
      // 1) Path: /MDN260611028  atau  /lacak/MDN260611028
      const pathParts = location.pathname.replace(/^\//, "").split("/");
      for (const part of pathParts) {
        // Nomor order Madeena: huruf+angka, minimal 8 karakter
        if (/^[A-Z0-9]{6,}$/i.test(part)) return part.toUpperCase();
      }
      // 2) Query param: ?order=MDN...
      const params = new URLSearchParams(location.search);
      return params.get("order") ? params.get("order").toUpperCase() : null;
    }

    // ── Update URL tanpa reload saat user search manual ──────────────
    function pushURL(noOrder) {
      const newURL = `/${noOrder}`;
      history.pushState({ noOrder }, "", newURL);
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("search-btn").addEventListener("click", () => {
        const val = document.getElementById("search-input").value.trim().toUpperCase();
        if (val) pushURL(val);
        doSearch();
      });
      document.getElementById("search-input").addEventListener("keydown", e => {
        if (e.key === "Enter") {
          const val = document.getElementById("search-input").value.trim().toUpperCase();
          if (val) pushURL(val);
          doSearch();
        }
      });

      // Auto-search jika URL sudah mengandung nomor order
      const autoOrder = getOrderFromURL();
      if (autoOrder) {
        document.getElementById("search-input").value = autoOrder;
        doSearch();
      }
    });

    // Handle browser back/forward
    window.addEventListener("popstate", (e) => {
      const no = e.state?.noOrder || getOrderFromURL();
      if (no) {
        document.getElementById("search-input").value = no;
        doSearch();
      } else {
        document.getElementById("search-input").value = "";
        document.getElementById("result-area").innerHTML = "";
        document.getElementById("error-msg").textContent = "";
      }
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #4F6FE8;
      --teal:      #0D9488;
      --amber:     #F59E0B;
      --green:     #10B981;
      --bg:        #F0F4FF;
      --card:      #FFFFFF;
      --text:      #1A1F36;
      --sub:       #6B7280;
      --border:    #E5E8F0;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, #4F6FE8 0%, #2563EB 100%);
      padding: 48px 20px 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='28' fill='none' stroke='white' stroke-opacity='.04' stroke-width='1'/%3E%3C/svg%3E") repeat;
      background-size: 60px 60px;
    }
    .hero-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .hero-logo-icon {
      width: 44px; height: 44px;
      background: rgba(255,255,255,.2);
      border-radius: 14px;
      display: grid; place-items: center;
    }
    .hero-brand {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.3px;
    }
    .hero h1 {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 800;
      color: #fff;
      letter-spacing: -.5px;
      line-height: 1.2;
      margin-bottom: 8px;
      position: relative;
    }
    .hero p {
      font-size: 15px;
      color: rgba(255,255,255,.75);
      position: relative;
    }

    /* ── SEARCH CARD ── */
    .search-wrapper {
      max-width: 560px;
      margin: -36px auto 0;
      padding: 0 16px;
      position: relative;
      z-index: 2;
    }
    .search-card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(79,111,232,.18);
    }
    .search-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--sub);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .search-row {
      display: flex;
      gap: 10px;
    }
    .search-input-wrap {
      flex: 1;
      position: relative;
    }
    .search-input-wrap svg {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--sub);
      pointer-events: none;
    }
    #search-input {
      width: 100%;
      height: 48px;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0 14px 0 42px;
      font-size: 14px;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: var(--bg);
      transition: border-color .2s;
      outline: none;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    #search-input:focus { border-color: var(--primary); background: #fff; }
    #search-input::placeholder { text-transform: none; letter-spacing: 0; color: #aab; }

    #search-btn {
      height: 48px;
      padding: 0 22px;
      background: linear-gradient(135deg, var(--primary) 0%, #2563EB 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: "Inter", sans-serif;
      cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      transition: opacity .2s, transform .1s;
      white-space: nowrap;
    }
    #search-btn:hover { opacity: .92; }
    #search-btn:active { transform: scale(.97); }
    #search-btn:disabled { opacity: .6; cursor: default; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      margin-top: 10px;
      font-size: 13px;
      color: #DC2626;
      min-height: 18px;
    }

    /* ── RESULT ── */
    #result-area {
      max-width: 560px;
      margin: 20px auto 40px;
      padding: 0 16px;
    }

    .result-card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.07);
      overflow: hidden;
      border: 1.5px solid rgba(79,111,232,.1);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 14px;
    }
    .status-icon {
      width: 46px; height: 46px;
      border-radius: 14px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .card-meta { flex: 1; min-width: 0; }
    .order-no {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .3px;
    }
    .cust-name {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
    }
    .badge {
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .divider { height: 1px; background: var(--border); margin: 0 18px; }

    .info-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      padding: 12px 18px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 140px;
      padding: 6px 0;
    }
    .info-icon { font-size: 18px; }
    .info-label { font-size: 10px; color: var(--sub); font-weight: 500; text-transform: uppercase; letter-spacing: .4px; }
    .info-val   { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 1px; }

    /* ── TIMELINE ── */
    .timeline { padding: 12px 18px 4px; }

    .tl-row {
      display: flex;
      gap: 0;
      min-height: 64px;
    }
    .tl-row.last { min-height: auto; }

    .tl-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 28px;
      flex-shrink: 0;
    }
    .tl-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #E5E8F0;
      margin-top: 4px;
      flex-shrink: 0;
      transition: all .3s;
    }
    .tl-dot.done  { width: 12px; height: 12px; }
    .tl-dot.active {
      width: 16px; height: 16px;
      margin-top: 2px;
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 0 3px transparent; }
      50%      { box-shadow: 0 0 0 5px currentColor; }
    }
    .tl-line {
      flex: 1;
      width: 2px;
      background: #E5E8F0;
      border-radius: 2px;
      margin: 4px 0;
      min-height: 24px;
    }

    .tl-content {
      flex: 1;
      padding: 0 0 18px 12px;
    }
    .tl-row.last .tl-content { padding-bottom: 14px; }

    .tl-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .tl-label.muted { color: #C4C9D8; }
    .tl-label.active-label { font-weight: 700; }

    .tl-desc {
      font-size: 11px;
      color: var(--sub);
      margin-top: 1px;
    }
    .tl-desc.muted { color: #D8DCE8; }
    .tl-time {
      font-size: 10px;
      font-weight: 600;
      margin-top: 4px;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 24px 16px 32px;
      font-size: 12px;
      color: var(--sub);
    }
    footer span { color: var(--primary); font-weight: 600; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .hero { padding: 36px 16px 70px; }
      .search-card { padding: 16px; }
      #search-btn { padding: 0 16px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-logo">
      <div class="hero-logo-icon">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="3"/>
    <line x1="2" y1="7" x2="22" y2="7"/>
    <circle cx="6" cy="4.5" r="0.8" fill="white" stroke="none"/>
    <circle cx="9" cy="4.5" r="0.8" fill="white" stroke="none"/>
    <circle cx="12" cy="14" r="5"/>
    <circle cx="12" cy="14" r="2.5"/>
    <line x1="12" y1="11.5" x2="12" y2="9.5" stroke="white" stroke-width="1.5"/>
  </svg>
</div>
      <span class="hero-brand">Madeena Laundry</span>
    </div>
    <h1>Lacak Status Order</h1>
    <p>Masukkan nomor order untuk melihat status laundry kamu secara real-time</p>
  </div>

  <!-- SEARCH -->
  <div class="search-wrapper">
    <div class="search-card">
      <p class="search-label">Nomor Order</p>
      <div class="search-row">
        <div class="search-input-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="search-input" type="text" placeholder="cth: MDN260611028" autocomplete="off" />
        </div>
        <button id="search-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Lacak
        </button>
      </div>
      <p id="error-msg"></p>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result-area"></div>

  <!-- FOOTER -->
  <footer>
    Powored by : Rdh Project - <span>Madeena Laundry</span>
  </footer>

</body>
</html>
